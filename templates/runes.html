{% extends "base.html" %}

{% block title %}符文配置 - LOL助手{% endblock %}

{% block content %}
<style>
    /* 符文配置页面样式 */
    .rune-interface {
        width: 100%;
        max-width: 1200px;
        margin: 2rem auto;
        padding: 2rem;
    }

    .page-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .page-title {
        font-size: 2rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 0.5rem;
    }

    .page-subtitle {
        font-size: 1rem;
        color: var(--muted-foreground);
    }

    /* 符文系选择器 */
    .tree-selector {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }

    .tree-option {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        padding: 1rem;
        border-radius: var(--radius);
        border: 2px solid transparent;
    }

    .tree-option:hover {
        transform: translateY(-4px);
        border-color: var(--border);
    }

    .tree-option.selected {
        border-color: var(--primary);
        background: rgba(200, 170, 110, 0.1);
    }

    .tree-option.primary {
        border-color: var(--primary);
        box-shadow: 0 0 20px rgba(200, 170, 110, 0.3);
    }

    .tree-option.secondary {
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(200, 170, 110, 0.2);
    }

    .tree-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 2px solid rgba(200, 170, 110, 0.3);
    }

    .tree-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .tree-name {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--foreground);
        text-align: center;
    }

    /* 符文选择区域 */
    .rune-selection-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
    }

    .rune-tree-panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
    }

    .panel-header {
        text-align: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
    }

    .panel-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 0.25rem;
    }

    .panel-subtitle {
        font-size: 0.8rem;
        color: var(--muted-foreground);
    }

    /* 符文层级 */
    .rune-tier {
        margin-bottom: 1.5rem;
    }

    .tier-header {
        text-align: center;
        margin-bottom: 1rem;
    }

    .tier-title {
        font-size: 0.8rem;
        color: var(--muted-foreground);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .rune-slots {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }

    /* 符文图标 */
    .rune-slot {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid var(--border);
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        background: var(--muted);
    }

    .rune-slot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .rune-slot:hover {
        transform: scale(1.1);
        border-color: var(--primary);
        box-shadow: 0 0 15px rgba(200, 170, 110, 0.5);
    }

    .rune-slot.selected {
        border-color: var(--primary);
        box-shadow: 0 0 20px rgba(200, 170, 110, 0.6);
        background: rgba(200, 170, 110, 0.2);
    }

    .rune-slot.disabled {
        opacity: 0.3;
        cursor: not-allowed;
    }

    .rune-slot.disabled:hover {
        transform: none;
        border-color: var(--border);
        box-shadow: none;
    }

    /* 符文提示框 */
    .rune-tooltip {
        position: absolute;
        background: var(--popover);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem;
        max-width: 300px;
        z-index: 1000;
        box-shadow: var(--shadow-lg);
        display: none;
        pointer-events: none;
    }

    .tooltip-name {
        font-size: 1rem;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 0.5rem;
    }

    .tooltip-description {
        font-size: 0.85rem;
        color: var(--foreground);
        line-height: 1.5;
    }

    /* 响应式 */
    @media (max-width: 768px) {
        .rune-selection-area {
            grid-template-columns: 1fr;
        }
        
        .tree-selector {
            gap: 1rem;
        }
        
        .tree-icon {
            width: 48px;
            height: 48px;
        }
    }
</style>

<div class="rune-interface">
    <!-- 页面标题 -->
    <div class="page-header">
        <h1 class="page-title">符文配置器</h1>
        <p class="page-subtitle">选择主系和副系符文,打造专属符文页</p>
    </div>

    <!-- 符文系选择器 -->
    <div class="tree-selector" id="treeSelector">
        {% for tree in rune_trees %}
        <div class="tree-option" data-tree-id="{{ tree.id }}" data-tree-key="{{ tree.key }}">
            <div class="tree-icon">
                <img src="https://ddragon.leagueoflegends.com/cdn/img/{{ tree.icon }}" alt="{{ tree.name }}">
            </div>
            <div class="tree-name">{{ tree.name }}</div>
        </div>
        {% endfor %}
    </div>

    <!-- 符文选择区域 -->
    <div class="rune-selection-area">
        <!-- 主系符文面板 -->
        <div class="rune-tree-panel" id="primaryPanel">
            <div class="panel-header">
                <div class="panel-title">主系符文</div>
                <div class="panel-subtitle">选择一个符文系作为主系</div>
            </div>
            <div id="primaryRunes"></div>
        </div>

        <!-- 副系符文面板 -->
        <div class="rune-tree-panel" id="secondaryPanel">
            <div class="panel-header">
                <div class="panel-title">副系符文</div>
                <div class="panel-subtitle">选择另一个符文系作为副系</div>
            </div>
            <div id="secondaryRunes"></div>
        </div>
    </div>
</div>

<!-- 符文提示框 -->
<div class="rune-tooltip" id="runeTooltip">
    <div class="tooltip-name" id="tooltipName"></div>
    <div class="tooltip-description" id="tooltipDescription"></div>
</div>

<script>
    // 符文数据
    const runeTreesData = {{ rune_trees | tojson }};
    const version = "{{ version }}";
    
    let selectedPrimary = null;
    let selectedSecondary = null;
    let selectedRunes = {
        primary: [null, null, null, null],
        secondary: [null, null, null]
    };

    // 初始化
    function init() {
        setupTreeSelector();
    }

    // 设置符文系选择器
    function setupTreeSelector() {
        const treeOptions = document.querySelectorAll('.tree-option');
        
        treeOptions.forEach(option => {
            option.addEventListener('click', () => {
                const treeId = parseInt(option.dataset.treeId);
                handleTreeSelection(treeId);
            });
        });
    }

    // 处理符文系选择
    function handleTreeSelection(treeId) {
        if (!selectedPrimary) {
            // 选择主系
            selectedPrimary = treeId;
            updateTreeUI();
            renderPrimaryRunes();
        } else if (!selectedSecondary && treeId !== selectedPrimary) {
            // 选择副系
            selectedSecondary = treeId;
            updateTreeUI();
            renderSecondaryRunes();
        } else if (treeId === selectedPrimary) {
            // 取消主系,重置所有
            selectedPrimary = null;
            selectedSecondary = null;
            selectedRunes = { primary: [null, null, null, null], secondary: [null, null, null] };
            updateTreeUI();
            clearPanels();
        } else if (treeId === selectedSecondary) {
            // 取消副系
            selectedSecondary = null;
            selectedRunes.secondary = [null, null, null];
            updateTreeUI();
            clearSecondaryPanel();
        }
    }

    // 更新符文系UI
    function updateTreeUI() {
        const treeOptions = document.querySelectorAll('.tree-option');
        treeOptions.forEach(option => {
            const treeId = parseInt(option.dataset.treeId);
            option.classList.remove('selected', 'primary', 'secondary');

            if (treeId === selectedPrimary) {
                option.classList.add('selected', 'primary');
            } else if (treeId === selectedSecondary) {
                option.classList.add('selected', 'secondary');
            }
        });
    }

    // 渲染主系符文
    function renderPrimaryRunes() {
        const tree = runeTreesData.find(t => t.id === selectedPrimary);
        if (!tree) return;

        const container = document.getElementById('primaryRunes');
        container.innerHTML = '';

        tree.slots.forEach((slot, slotIndex) => {
            const tierDiv = document.createElement('div');
            tierDiv.className = 'rune-tier';

            const tierHeader = document.createElement('div');
            tierHeader.className = 'tier-header';
            tierHeader.innerHTML = `<div class="tier-title">${slotIndex === 0 ? '基石符文' : '第' + slotIndex + '层'}</div>`;
            tierDiv.appendChild(tierHeader);

            const slotsDiv = document.createElement('div');
            slotsDiv.className = 'rune-slots';

            slot.runes.forEach(rune => {
                const runeSlot = createRuneSlot(rune, slotIndex, 'primary');
                slotsDiv.appendChild(runeSlot);
            });

            tierDiv.appendChild(slotsDiv);
            container.appendChild(tierDiv);
        });
    }

    // 渲染副系符文
    function renderSecondaryRunes() {
        const tree = runeTreesData.find(t => t.id === selectedSecondary);
        if (!tree) return;

        const container = document.getElementById('secondaryRunes');
        container.innerHTML = '';

        // 副系只显示后3层(跳过基石符文)
        tree.slots.slice(1).forEach((slot, slotIndex) => {
            const tierDiv = document.createElement('div');
            tierDiv.className = 'rune-tier';

            const tierHeader = document.createElement('div');
            tierHeader.className = 'tier-header';
            tierHeader.innerHTML = `<div class="tier-title">第${slotIndex + 1}层</div>`;
            tierDiv.appendChild(tierHeader);

            const slotsDiv = document.createElement('div');
            slotsDiv.className = 'rune-slots';

            slot.runes.forEach(rune => {
                const runeSlot = createRuneSlot(rune, slotIndex, 'secondary');
                slotsDiv.appendChild(runeSlot);
            });

            tierDiv.appendChild(slotsDiv);
            container.appendChild(tierDiv);
        });
    }

    // 创建符文槽位
    function createRuneSlot(rune, slotIndex, type) {
        const slot = document.createElement('div');
        slot.className = 'rune-slot';
        slot.dataset.runeId = rune.id;
        slot.dataset.slotIndex = slotIndex;
        slot.dataset.type = type;

        const img = document.createElement('img');
        img.src = `https://ddragon.leagueoflegends.com/cdn/img/${rune.icon}`;
        img.alt = rune.name;
        slot.appendChild(img);

        // 点击选择符文
        slot.addEventListener('click', () => {
            if (!slot.classList.contains('disabled')) {
                selectRune(rune, slotIndex, type);
            }
        });

        // 悬停显示提示
        slot.addEventListener('mouseenter', (e) => {
            showTooltip(rune, e);
        });

        slot.addEventListener('mouseleave', () => {
            hideTooltip();
        });

        return slot;
    }

    // 选择符文
    function selectRune(rune, slotIndex, type) {
        if (type === 'primary') {
            selectedRunes.primary[slotIndex] = rune.id;
            // 取消同层其他符文的选中状态
            document.querySelectorAll(`.rune-slot[data-type="primary"][data-slot-index="${slotIndex}"]`).forEach(slot => {
                slot.classList.remove('selected');
            });
        } else {
            selectedRunes.secondary[slotIndex] = rune.id;
            // 取消同层其他符文的选中状态
            document.querySelectorAll(`.rune-slot[data-type="secondary"][data-slot-index="${slotIndex}"]`).forEach(slot => {
                slot.classList.remove('selected');
            });
        }

        // 添加选中状态
        document.querySelector(`.rune-slot[data-rune-id="${rune.id}"]`).classList.add('selected');
    }

    // 显示提示框
    function showTooltip(rune, event) {
        const tooltip = document.getElementById('runeTooltip');
        const tooltipName = document.getElementById('tooltipName');
        const tooltipDescription = document.getElementById('tooltipDescription');

        tooltipName.textContent = rune.name;
        tooltipDescription.textContent = rune.shortDesc || rune.longDesc;

        tooltip.style.display = 'block';
        tooltip.style.left = event.pageX + 15 + 'px';
        tooltip.style.top = event.pageY + 15 + 'px';
    }

    // 隐藏提示框
    function hideTooltip() {
        document.getElementById('runeTooltip').style.display = 'none';
    }

    // 清空面板
    function clearPanels() {
        document.getElementById('primaryRunes').innerHTML = '';
        document.getElementById('secondaryRunes').innerHTML = '';
    }

    // 清空副系面板
    function clearSecondaryPanel() {
        document.getElementById('secondaryRunes').innerHTML = '';
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
{% endblock %}
