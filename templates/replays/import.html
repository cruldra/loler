{% extends "base.html" %}

{% block title %}录像导入 - LOL助手{% endblock %}

{% block content %}
<style>
    .lol-container {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
        min-height: 100vh;
    }

    .lol-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .lol-title {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 1rem;
        text-shadow: 0 0 20px rgba(201, 170, 113, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    .lol-subtitle {
        font-size: 1.1rem;
        color: var(--muted-foreground);
        font-weight: 400;
    }

    .lol-import-card {
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 2rem;
        box-shadow: var(--shadow-xl);
    }

    .lol-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .lol-folder-info {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--muted);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.75rem 1rem;
        flex: 1;
        min-width: 300px;
    }

    .lol-folder-icon {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-foreground);
    }

    .lol-folder-path {
        font-size: 0.9rem;
        color: var(--foreground);
        font-family: var(--font-mono);
    }

    .lol-toolbar-actions {
        display: flex;
        gap: 1rem;
    }

    .lol-btn {
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 300ms ease;
        border: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .lol-btn-secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
        border: 1px solid var(--border);
    }

    .lol-btn-secondary:hover {
        background: var(--accent);
        transform: translateY(-2px);
    }

    .lol-btn-primary {
        background: var(--primary);
        color: var(--primary-foreground);
    }

    .lol-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
    }

    .lol-btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .lol-table-container {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        margin-bottom: 2rem;
    }

    .lol-table {
        width: 100%;
        border-collapse: collapse;
    }

    .lol-table th {
        background: var(--muted);
        color: var(--foreground);
        font-weight: 600;
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
    }

    .lol-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
    }

    .lol-table tr:hover {
        background: var(--muted);
    }

    .lol-table tr.selected {
        background: var(--accent);
    }

    .lol-checkbox {
        width: 18px;
        height: 18px;
        border: 2px solid var(--border);
        border-radius: 3px;
        cursor: pointer;
        transition: all 250ms ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .lol-checkbox.checked {
        background: var(--primary);
        border-color: var(--primary);
    }

    .lol-checkbox.checked::after {
        content: '✓';
        color: var(--primary-foreground);
        font-size: 12px;
        font-weight: bold;
    }

    .lol-file-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .lol-file-icon {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-foreground);
    }

    .lol-file-name {
        font-weight: 600;
        color: var(--foreground);
        margin-bottom: 0.25rem;
        font-size: 0.9rem;
    }

    .lol-file-meta {
        font-size: 0.8rem;
        color: var(--muted-foreground);
    }

    .lol-input {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0.5rem 0.75rem;
        color: var(--foreground);
        font-size: 0.85rem;
        transition: all 300ms ease;
    }

    .lol-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(201, 170, 113, 0.1);
    }

    .lol-textarea {
        min-height: 60px;
        resize: vertical;
    }

    .lol-status-indicator {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.8rem;
        font-weight: 500;
    }

    .lol-status-pending {
        background: rgba(255, 193, 7, 0.1);
        color: #ffc107;
        border: 1px solid rgba(255, 193, 7, 0.3);
    }

    .lol-status-ready {
        background: rgba(76, 175, 80, 0.1);
        color: #4caf50;
        border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .lol-summary-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--muted);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1rem;
        margin-bottom: 2rem;
    }

    .lol-summary-stats {
        display: flex;
        gap: 2rem;
    }

    .lol-stat-item {
        text-align: center;
    }

    .lol-stat-number {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--primary);
    }

    .lol-stat-label {
        font-size: 0.8rem;
        color: var(--muted-foreground);
    }

    .lol-actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
    }

    .lol-success-message {
        background: rgba(76, 175, 80, 0.1);
        border: 1px solid rgba(76, 175, 80, 0.3);
        border-radius: var(--radius);
        padding: 1rem;
        margin-bottom: 1rem;
        color: #4caf50;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        position: relative;
    }

    .lol-error-message {
        background: rgba(244, 67, 54, 0.1);
        border: 1px solid rgba(244, 67, 54, 0.3);
        border-radius: var(--radius);
        padding: 1rem;
        margin-bottom: 1rem;
        color: #f44336;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        position: relative;
    }

    .lol-message-close {
        margin-left: auto;
        background: none;
        border: none;
        color: inherit;
        cursor: pointer;
        padding: 0.25rem;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.7;
        transition: opacity 200ms ease;
    }

    .lol-message-close:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.1);
    }

    .lol-hidden {
        display: none !important;
    }
</style>

<div class="lol-container">
    <div class="lol-header">
        <h1 class="lol-title">
            <i data-lucide="video" class="w-10 h-10"></i>
            录像导入
        </h1>
        <p class="lol-subtitle">批量导入和管理LOL录像文件</p>
    </div>

    <div class="lol-import-card">
        <div id="successMessage" class="lol-success-message lol-hidden">
            <i data-lucide="check-circle" class="w-5 h-5"></i>
            <span>操作成功！</span>
            <button onclick="hideMessages()" class="lol-message-close">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div id="errorMessage" class="lol-error-message lol-hidden">
            <i data-lucide="alert-circle" class="w-5 h-5"></i>
            <span id="errorText">操作失败，请重试</span>
            <button onclick="hideMessages()" class="lol-message-close">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="lol-toolbar">
            <div class="lol-folder-info">
                <div class="lol-folder-icon">
                    <i data-lucide="folder" class="w-4 h-4"></i>
                </div>
                <div>
                    <div style="font-size: 0.8rem; color: var(--muted-foreground); margin-bottom: 0.25rem;">录像文件夹</div>
                    <div class="lol-folder-path" id="folderPath">C:\Users\cruld\Documents\League of Legends\Replays</div>
                </div>
            </div>

            <div class="lol-toolbar-actions">
                <button class="lol-btn lol-btn-secondary" onclick="selectFolder()">
                    <i data-lucide="folder-open" class="w-4 h-4"></i>
                    更改文件夹
                </button>
                <button class="lol-btn lol-btn-primary" onclick="scanFolder()">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    扫描录像
                </button>
            </div>
        </div>

        <div id="summaryBar" class="lol-summary-bar lol-hidden">
            <div class="lol-summary-stats">
                <div class="lol-stat-item">
                    <div class="lol-stat-number" id="totalFiles">0</div>
                    <div class="lol-stat-label">总文件数</div>
                </div>
                <div class="lol-stat-item">
                    <div class="lol-stat-number" id="selectedFiles">0</div>
                    <div class="lol-stat-label">已选择</div>
                </div>
                <div class="lol-stat-item">
                    <div class="lol-stat-number" id="readyFiles">0</div>
                    <div class="lol-stat-label">准备就绪</div>
                </div>
                <div class="lol-stat-item">
                    <div class="lol-stat-number" id="totalSize">0MB</div>
                    <div class="lol-stat-label">总大小</div>
                </div>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button class="lol-btn lol-btn-secondary" onclick="selectAllFiles()">
                    <i data-lucide="check-square" class="w-4 h-4"></i>
                    全选
                </button>
                <button class="lol-btn lol-btn-secondary" onclick="clearAllFiles()">
                    <i data-lucide="square" class="w-4 h-4"></i>
                    清空
                </button>
            </div>
        </div>

        <div id="tableContainer" class="lol-table-container lol-hidden">
            <table class="lol-table">
                <thead>
                    <tr>
                        <th style="width: 50px;">
                            <div class="lol-checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()"></div>
                        </th>
                        <th style="width: 300px;">录像文件</th>
                        <th style="width: 250px;">对局名称</th>
                        <th>描述信息</th>
                        <th style="width: 120px;">状态</th>
                    </tr>
                </thead>
                <tbody id="fileTableBody">
                </tbody>
            </table>
        </div>

        <div id="emptyState" style="text-align: center; padding: 3rem; color: var(--muted-foreground);">
            <i data-lucide="folder-search" class="w-16 h-16 mx-auto mb-4"></i>
            <h3 style="font-size: 1.2rem; margin-bottom: 0.5rem;">暂无录像文件</h3>
            <p>点击"扫描录像"开始导入录像文件</p>
        </div>

        <div class="lol-actions">
            <a href="/replays/page" class="lol-btn lol-btn-secondary">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                返回列表
            </a>
            <button id="importBtn" class="lol-btn lol-btn-primary lol-hidden" onclick="importSelectedFiles()" disabled>
                <i data-lucide="download" class="w-4 h-4"></i>
                导入录像
            </button>
        </div>
    </div>
</div>

<script>
    lucide.createIcons();

    let replayFiles = [];
    let selectedFiles = new Set();

    function selectFolder() {
        const newPath = prompt("请输入录像文件夹路径:", document.getElementById('folderPath').textContent);
        if (newPath) {
            document.getElementById('folderPath').textContent = newPath;
        }
    }

    async function scanFolder() {
        const folderPath = document.getElementById('folderPath').textContent;

        if (!folderPath || folderPath === '请选择文件夹') {
            showError('请先选择文件夹路径');
            return;
        }

        const scanBtn = document.querySelector('.lol-btn-primary');
        const originalText = scanBtn.innerHTML;
        scanBtn.disabled = true;
        scanBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 正在扫描...';
        lucide.createIcons();

        const formData = new FormData();
        formData.append('folder_path', folderPath);

        const response = await fetch('/replays/scan', {
            method: 'POST',
            body: formData
        });

        const result = await response.json();

        scanBtn.disabled = false;
        scanBtn.innerHTML = originalText;
        lucide.createIcons();

        if (!result.success) {
            showError(result.message || '扫描失败');
            return;
        }

        if (result.count === 0) {
            showError('该文件夹中没有找到.rofl录像文件');
            return;
        }

        replayFiles = result.files.map(file => ({
            ...file,
            title: generateDefaultTitle(file.name),
            description: "",
            status: "pending"
        }));

        displayFileTable();
        showControls();
        updateSummary();

        showSuccess(`成功扫描到 ${result.count} 个录像文件`);
    }

    function displayFileTable() {
        const tableBody = document.getElementById('fileTableBody');
        tableBody.innerHTML = '';

        replayFiles.forEach((file, index) => {
            const row = document.createElement('tr');
            row.id = `row-${index}`;

            row.innerHTML = `
                <td>
                    <div class="lol-checkbox" id="checkbox-${index}" onclick="toggleFileSelection(${index})"></div>
                </td>
                <td>
                    <div class="lol-file-info">
                        <div class="lol-file-icon">
                            <i data-lucide="video" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <div class="lol-file-name">${file.name}</div>
                            <div class="lol-file-meta">${formatFileSize(file.size)} • ${file.date}</div>
                        </div>
                    </div>
                </td>
                <td>
                    <input type="text" class="lol-input" value="${file.title}"
                           onchange="updateFileTitle(${index}, this.value)"
                           placeholder="输入对局名称">
                </td>
                <td>
                    <textarea class="lol-input lol-textarea"
                              placeholder="添加描述信息..."
                              onchange="updateFileDescription(${index}, this.value)">${file.description}</textarea>
                </td>
                <td>
                    <div class="lol-status-indicator lol-status-${file.status}" id="status-${index}">
                        <i data-lucide="clock" class="w-3 h-3"></i>
                        <span>待完善</span>
                    </div>
                </td>
            `;

            tableBody.appendChild(row);
        });

        lucide.createIcons();
    }

    function toggleFileSelection(index) {
        const checkbox = document.getElementById(`checkbox-${index}`);
        const row = document.getElementById(`row-${index}`);

        if (selectedFiles.has(index)) {
            selectedFiles.delete(index);
            checkbox.classList.remove('checked');
            row.classList.remove('selected');
        } else {
            selectedFiles.add(index);
            checkbox.classList.add('checked');
            row.classList.add('selected');
        }

        updateSummary();
        updateImportButton();
        updateSelectAllCheckbox();
    }

    function toggleSelectAll() {
        if (selectedFiles.size === replayFiles.length) {
            clearAllFiles();
        } else {
            selectAllFiles();
        }
    }

    function selectAllFiles() {
        selectedFiles.clear();
        replayFiles.forEach((_, index) => {
            selectedFiles.add(index);
            document.getElementById(`checkbox-${index}`).classList.add('checked');
            document.getElementById(`row-${index}`).classList.add('selected');
        });
        updateSummary();
        updateImportButton();
        updateSelectAllCheckbox();
    }

    function clearAllFiles() {
        selectedFiles.clear();
        replayFiles.forEach((_, index) => {
            document.getElementById(`checkbox-${index}`).classList.remove('checked');
            document.getElementById(`row-${index}`).classList.remove('selected');
        });
        updateSummary();
        updateImportButton();
        updateSelectAllCheckbox();
    }

    function updateSelectAllCheckbox() {
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        if (selectedFiles.size === replayFiles.length && replayFiles.length > 0) {
            selectAllCheckbox.classList.add('checked');
        } else {
            selectAllCheckbox.classList.remove('checked');
        }
    }

    function updateFileTitle(index, title) {
        replayFiles[index].title = title.trim();
        updateFileStatus(index);
        updateSummary();
    }

    function updateFileDescription(index, description) {
        replayFiles[index].description = description.trim();
    }

    function updateFileStatus(index) {
        const file = replayFiles[index];
        const statusElement = document.getElementById(`status-${index}`);

        if (file.title.trim()) {
            file.status = "ready";
            statusElement.className = "lol-status-indicator lol-status-ready";
            statusElement.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i><span>准备就绪</span>';
        } else {
            file.status = "pending";
            statusElement.className = "lol-status-indicator lol-status-pending";
            statusElement.innerHTML = '<i data-lucide="clock" class="w-3 h-3"></i><span>待完善</span>';
        }

        lucide.createIcons();
    }

    function updateSummary() {
        document.getElementById('totalFiles').textContent = replayFiles.length;
        document.getElementById('selectedFiles').textContent = selectedFiles.size;

        const readyCount = replayFiles.filter(file => file.status === 'ready').length;
        document.getElementById('readyFiles').textContent = readyCount;

        const totalSize = Array.from(selectedFiles).reduce((sum, index) =>
            sum + replayFiles[index].size, 0
        );
        document.getElementById('totalSize').textContent = formatFileSize(totalSize);
    }

    function updateImportButton() {
        const importBtn = document.getElementById('importBtn');
        importBtn.disabled = selectedFiles.size === 0;
    }

    function showControls() {
        document.getElementById('summaryBar').classList.remove('lol-hidden');
        document.getElementById('tableContainer').classList.remove('lol-hidden');
        document.getElementById('importBtn').classList.remove('lol-hidden');
        document.getElementById('emptyState').classList.add('lol-hidden');
    }

    async function importSelectedFiles() {
        const unreadyFiles = Array.from(selectedFiles).filter(index =>
            replayFiles[index].status !== 'ready'
        );

        if (unreadyFiles.length > 0) {
            showError(`还有 ${unreadyFiles.length} 个录像未完善信息，请添加标题后再导入`);
            return;
        }

        if (selectedFiles.size === 0) {
            showError('请至少选择一个录像文件');
            return;
        }

        const importBtn = document.getElementById('importBtn');
        importBtn.disabled = true;
        importBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 导入中...';
        lucide.createIcons();

        const folderPath = document.getElementById('folderPath').textContent;
        let successCount = 0;
        let failCount = 0;

        for (const index of selectedFiles) {
            const file = replayFiles[index];
            const originalPath = `${folderPath}\\${file.name}`;

            const formData = new FormData();
            formData.append('name', file.title);
            formData.append('description', file.description);
            formData.append('original_path', originalPath);

            const response = await fetch('/replays/import', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                successCount++;
            } else {
                failCount++;
            }
        }

        importBtn.disabled = false;
        importBtn.innerHTML = '<i data-lucide="upload" class="w-4 h-4"></i> 批量导入';
        lucide.createIcons();

        if (failCount === 0) {
            showSuccess(`成功导入 ${successCount} 个录像文件`);
            setTimeout(() => {
                window.location.href = '/profile#replays';
            }, 1500);
        } else {
            showError(`导入完成：成功 ${successCount} 个，失败 ${failCount} 个`);
        }
    }

    function generateDefaultTitle(filename) {
        const match = filename.match(/LOL_Replay_(\d{4})_(\d{2})_(\d{2})_(\d{2})_(\d{2})_(\d{2})/);
        if (match) {
            const [, year, month, day, hour, minute] = match;
            return `${year}-${month}-${day} ${hour}:${minute} 对局录像`;
        }
        return filename.replace('.rofl', '');
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showSuccess(message, autoHide = false) {
        hideMessages();
        const successMsg = document.getElementById('successMessage');
        successMsg.querySelector('span').textContent = message;
        successMsg.classList.remove('lol-hidden');

        if (autoHide) {
            setTimeout(() => {
                successMsg.classList.add('lol-hidden');
            }, 3000);
        }
    }

    function showError(message, autoHide = false) {
        hideMessages();
        const errorMsg = document.getElementById('errorMessage');
        document.getElementById('errorText').textContent = message;
        errorMsg.classList.remove('lol-hidden');

        if (autoHide) {
            setTimeout(() => {
                errorMsg.classList.add('lol-hidden');
            }, 3000);
        }
    }

    function hideMessages() {
        document.getElementById('successMessage').classList.add('lol-hidden');
        document.getElementById('errorMessage').classList.add('lol-hidden');
    }
</script>
{% endblock %}
