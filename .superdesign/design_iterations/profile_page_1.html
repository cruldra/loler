<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Theme -->

    <style>
        /* Custom CSS Variables and Overrides */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans) !important;
            background-color: rgb(from var(--background) r g b) !important;
            color: rgb(from var(--foreground) r g b) !important;
            line-height: 1.6 !important;
        }
        
        /* Sidebar Styles */
        .sidebar {
            background-color: rgb(from var(--sidebar) r g b);
            border-right: 1px solid rgb(from var(--sidebar-border) r g b);
            box-shadow: var(--shadow-sm);
        }
        
        .sidebar-section-title {
            color: rgb(from var(--muted-foreground) r g b);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding: 0 1rem;
        }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            margin: 0.125rem 0.5rem;
            border-radius: var(--radius-md);
            color: rgb(from var(--sidebar-foreground) r g b);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 200ms ease-out;
            cursor: pointer;
        }
        
        .sidebar-item:hover {
            background-color: rgb(from var(--sidebar-accent) r g b);
            color: rgb(from var(--sidebar-accent-foreground) r g b);
            transform: translateX(2px);
        }
        
        .sidebar-item.active {
            background-color: rgb(from var(--sidebar-primary) r g b);
            color: rgb(from var(--sidebar-primary-foreground) r g b);
            box-shadow: var(--shadow-sm);
        }
        
        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background-color: rgb(from var(--sidebar-primary) r g b);
            border-radius: 0 2px 2px 0;
        }
        
        /* Main Content Styles */
        .main-content {
            background-color: rgb(from var(--background) r g b);
            min-height: 100vh;
            animation: fadeInUp 400ms ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                height: 100vh;
                z-index: 50;
                transition: left 300ms ease-out;
            }
            
            .sidebar.open {
                left: 0;
            }
            
            .main-content {
                margin-left: 0;
            }
        }
        
        /* Custom scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .sidebar::-webkit-scrollbar-thumb {
            background: rgb(from var(--muted-foreground) r g b / 0.3);
            border-radius: 2px;
        }
        
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgb(from var(--muted-foreground) r g b / 0.5);
        }
        
        /* Rune Editor Styles */
        .rune-slot {
            position: relative;
            transition: all 300ms ease-out;
        }
        
        .rune-slot:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
        
        .rune-slot.selected {
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: runeGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes runeGlow {
            from {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            }
            to {
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            }
        }
        
        .rune-tree-line {
            position: absolute;
            background: linear-gradient(to bottom, rgba(255, 215, 0, 0.3), rgba(255, 215, 0, 0.1));
            width: 2px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .rune-display {
            animation: runeRotate 20s linear infinite;
        }
        
        @keyframes runeRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        .rune-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 215, 0, 0.8);
            border-radius: 50%;
            animation: runeParticle 3s ease-in-out infinite;
        }
        
        @keyframes runeParticle {
            0%, 100% {
                opacity: 0;
                transform: translateY(0) scale(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-20px) scale(1);
            }
        }
    </style>
</head>

    <!-- Mobile Menu Toggle (hidden by default, can be shown when needed) -->
    <button id="mobile-menu-toggle" class="fixed top-4 left-4 z-50 p-2 rounded-md md:hidden hidden" style="background-color: rgb(from var(--card) r g b); box-shadow: var(--shadow-md);">
        <i data-lucide="menu" class="w-5 h-5" style="color: rgb(from var(--card-foreground) r g b);"></i>
    </button>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Mobile menu functionality
        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        
        if (mobileToggle) {
            mobileToggle.addEventListener('click', () => {
                sidebar.classList.toggle('open');
            });
        }
        
        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && !mobileToggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('open');
            }
        });
        
        // Smooth scrolling for sidebar
        const sidebarItems = document.querySelectorAll('.sidebar-item');
        sidebarItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Remove active class from all items
                sidebarItems.forEach(i => i.classList.remove('active'));
                
                // Add active class to clicked item
                item.classList.add('active');
                
                // Here you would typically handle the content switching
                console.log('Navigating to:', item.textContent.trim());
            });
        });
        
        // Rune Editor Interactions
        document.addEventListener('DOMContentLoaded', () => {
            // Add rune slot interactions
            const runeSlots = document.querySelectorAll('[class*="rounded-full"][class*="cursor-pointer"]');
            
            runeSlots.forEach(slot => {
                slot.addEventListener('click', (e) => {
                    // Remove selected class from all slots in the same row
                    const parent = slot.closest('.flex, .grid');
                    if (parent) {
                        parent.querySelectorAll('[class*="rounded-full"]').forEach(s => {
                            s.classList.remove('selected');
                        });
                    }
                    
                    // Add selected class to clicked slot
                    slot.classList.add('selected');
                    
                    // Add visual feedback
                    slot.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        slot.style.transform = '';
                    }, 200);
                });
                
                // Add hover sound effect (visual feedback)
                slot.addEventListener('mouseenter', () => {
                    slot.style.filter = 'brightness(1.3) drop-shadow(0 0 10px rgba(255, 215, 0, 0.5))';
                });
                
                slot.addEventListener('mouseleave', () => {
                    if (!slot.classList.contains('selected')) {
                        slot.style.filter = '';
                    }
                });
            });
            
            // Add floating particles to the rune display
            const runeDisplay = document.querySelector('.rune-display');
            if (runeDisplay) {
                setInterval(() => {
                    createRuneParticle(runeDisplay);
                }, 1000);
            }
        });
        
        function createRuneParticle(container) {
            const particle = document.createElement('div');
            particle.className = 'rune-particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            
            container.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 3000);
        }
    </script>
</body>
</html>
