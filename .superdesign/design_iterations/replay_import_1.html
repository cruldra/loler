<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>录像导入 - LOL助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lol_theme.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans) !important;
            background: 
                radial-gradient(ellipse at center, rgba(20, 30, 48, 0.8) 0%, rgba(10, 15, 25, 0.95) 70%),
                linear-gradient(135deg, #0f1419 0%, #1a2332 50%, #0f1419 100%) !important;
            color: #c9aa71 !important;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景纹理效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(200, 170, 110, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(200, 170, 110, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .lol-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .lol-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .lol-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #c9aa71;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(201, 170, 113, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .lol-subtitle {
            font-size: 1.1rem;
            color: rgba(201, 170, 113, 0.7);
            font-weight: 400;
        }

        .lol-import-card {
            background: linear-gradient(135deg, 
                rgba(20, 30, 48, 0.9) 0%, 
                rgba(15, 25, 40, 0.95) 50%, 
                rgba(10, 20, 35, 0.9) 100%);
            border: 2px solid rgba(201, 170, 113, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(201, 170, 113, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .lol-import-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #c9aa71 50%, 
                transparent 100%);
            opacity: 0.6;
        }

        .lol-upload-area {
            border: 3px dashed rgba(201, 170, 113, 0.3);
            border-radius: 1rem;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 400ms ease;
            background: rgba(201, 170, 113, 0.02);
            position: relative;
            margin-bottom: 2rem;
        }

        .lol-upload-area:hover {
            border-color: rgba(201, 170, 113, 0.6);
            background: rgba(201, 170, 113, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 170, 113, 0.1);
        }

        .lol-upload-area.dragover {
            border-color: #c9aa71;
            background: rgba(201, 170, 113, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(201, 170, 113, 0.2);
        }

        .lol-upload-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #c9aa71, #d4b876);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: #0f1419;
            font-size: 2rem;
            box-shadow: 0 10px 20px rgba(201, 170, 113, 0.2);
            transition: all 300ms ease;
        }

        .lol-upload-area:hover .lol-upload-icon {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 15px 30px rgba(201, 170, 113, 0.3);
        }

        .lol-upload-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #c9aa71;
            margin-bottom: 0.5rem;
        }

        .lol-upload-hint {
            font-size: 0.95rem;
            color: rgba(201, 170, 113, 0.6);
            margin-bottom: 1rem;
        }

        .lol-upload-formats {
            display: inline-block;
            background: rgba(201, 170, 113, 0.1);
            border: 1px solid rgba(201, 170, 113, 0.2);
            border-radius: 2rem;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            color: rgba(201, 170, 113, 0.8);
        }

        .lol-form-section {
            margin-bottom: 2rem;
        }

        .lol-form-group {
            margin-bottom: 1.5rem;
        }

        .lol-label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #c9aa71;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lol-input {
            width: 100%;
            background: rgba(201, 170, 113, 0.05);
            border: 1px solid rgba(201, 170, 113, 0.2);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: #c9aa71;
            font-size: 0.95rem;
            transition: all 300ms ease;
        }

        .lol-input:focus {
            outline: none;
            border-color: #c9aa71;
            background: rgba(201, 170, 113, 0.08);
            box-shadow: 0 0 0 3px rgba(201, 170, 113, 0.1);
        }

        .lol-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .lol-file-info {
            background: rgba(201, 170, 113, 0.05);
            border: 1px solid rgba(201, 170, 113, 0.2);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .lol-file-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(201, 170, 113, 0.1);
        }

        .lol-file-item:last-child {
            border-bottom: none;
        }

        .lol-file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #c9aa71, #d4b876);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f1419;
            font-size: 1.2rem;
        }

        .lol-file-details {
            flex: 1;
        }

        .lol-file-name {
            font-weight: 600;
            color: #c9aa71;
            margin-bottom: 0.25rem;
        }

        .lol-file-path {
            font-size: 0.85rem;
            color: rgba(201, 170, 113, 0.6);
            font-family: var(--font-mono);
        }

        .lol-file-size {
            font-size: 0.85rem;
            color: rgba(201, 170, 113, 0.7);
        }

        .lol-progress {
            width: 100%;
            height: 6px;
            background: rgba(201, 170, 113, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .lol-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #c9aa71, #d4b876);
            border-radius: 3px;
            transition: width 300ms ease;
            position: relative;
        }

        .lol-progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.2) 50%, 
                transparent 100%);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .lol-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .lol-btn {
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 300ms ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .lol-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.1) 50%, 
                transparent 100%);
            transition: left 500ms ease;
        }

        .lol-btn:hover::before {
            left: 100%;
        }

        .lol-btn-secondary {
            background: rgba(201, 170, 113, 0.1);
            color: rgba(201, 170, 113, 0.8);
            border: 1px solid rgba(201, 170, 113, 0.2);
        }

        .lol-btn-secondary:hover {
            background: rgba(201, 170, 113, 0.15);
            color: #c9aa71;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(201, 170, 113, 0.1);
        }

        .lol-btn-primary {
            background: linear-gradient(135deg, #c9aa71, #d4b876);
            color: #0f1419;
            box-shadow: 0 5px 15px rgba(201, 170, 113, 0.2);
        }

        .lol-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(201, 170, 113, 0.3);
        }

        .lol-btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .lol-hidden {
            display: none;
        }

        .lol-success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lol-error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #f44336;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lol-import-card {
            animation: fadeInUp 600ms ease-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .lol-container {
                padding: 1rem;
            }

            .lol-title {
                font-size: 2rem;
            }

            .lol-upload-area {
                padding: 2rem 1rem;
            }

            .lol-actions {
                flex-direction: column;
            }

            .lol-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="lol-container">
        <div class="lol-header">
            <h1 class="lol-title">
                <i data-lucide="video" class="w-10 h-10"></i>
                录像导入
            </h1>
            <p class="lol-subtitle">导入LOL录像文件到本地数据库</p>
        </div>

        <div class="lol-import-card">
            <!-- 成功/错误消息 -->
            <div id="successMessage" class="lol-success-message lol-hidden">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                <span>录像导入成功！</span>
            </div>

            <div id="errorMessage" class="lol-error-message lol-hidden">
                <i data-lucide="alert-circle" class="w-5 h-5"></i>
                <span id="errorText">导入失败，请重试</span>
            </div>

            <!-- 文件上传区域 -->
            <div class="lol-upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="lol-upload-icon">
                    <i data-lucide="upload" class="w-8 h-8"></i>
                </div>
                <div class="lol-upload-text">拖拽录像文件到此处</div>
                <div class="lol-upload-hint">或点击选择文件</div>
                <div class="lol-upload-formats">支持格式: .rofl</div>
            </div>

            <input type="file" id="fileInput" accept=".rofl" class="lol-hidden" multiple>

            <!-- 文件信息 -->
            <div id="fileInfo" class="lol-file-info lol-hidden">
                <div id="fileList"></div>
                <div id="uploadProgress" class="lol-progress lol-hidden">
                    <div class="lol-progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
            </div>

            <!-- 表单信息 -->
            <div id="formSection" class="lol-form-section lol-hidden">
                <div class="lol-form-group">
                    <label class="lol-label" for="matchName">
                        <i data-lucide="gamepad-2" class="w-4 h-4"></i>
                        对局名称
                    </label>
                    <input type="text" id="matchName" class="lol-input" placeholder="例如: 翡翠3盲僧教学局">
                </div>

                <div class="lol-form-group">
                    <label class="lol-label" for="description">
                        <i data-lucide="file-text" class="w-4 h-4"></i>
                        描述信息
                    </label>
                    <textarea id="description" class="lol-input lol-textarea" placeholder="添加对局描述、学习要点等..."></textarea>
                </div>

                <div class="lol-form-group">
                    <label class="lol-label">
                        <i data-lucide="folder" class="w-4 h-4"></i>
                        文件路径信息
                    </label>
                    <div class="lol-input" style="background: rgba(201, 170, 113, 0.02); color: rgba(201, 170, 113, 0.6);">
                        <div style="margin-bottom: 0.5rem;">
                            <strong>原始路径:</strong> <span id="originalPath">-</span>
                        </div>
                        <div>
                            <strong>导入后路径:</strong> <span id="targetPath">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="lol-actions">
                <button class="lol-btn lol-btn-secondary" onclick="resetForm()">
                    <i data-lucide="x" class="w-4 h-4"></i>
                    取消
                </button>
                <button id="importBtn" class="lol-btn lol-btn-primary" onclick="importReplay()" disabled>
                    <i data-lucide="download" class="w-4 h-4"></i>
                    导入录像
                </button>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        let selectedFiles = [];

        // 文件输入事件
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        // 拖拽事件
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(file => 
                file.name.toLowerCase().endsWith('.rofl')
            );
            if (files.length > 0) {
                handleFiles(files);
            } else {
                showError('请选择有效的.rofl录像文件');
            }
        });

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            handleFiles(files);
        }

        function handleFiles(files) {
            if (files.length === 0) return;

            selectedFiles = files;
            displayFileInfo(files);
            showFormSection();
            
            // 自动生成对局名称
            if (files.length === 1) {
                const fileName = files[0].name.replace('.rofl', '');
                document.getElementById('matchName').value = fileName;
            } else {
                document.getElementById('matchName').value = `批量导入 (${files.length}个文件)`;
            }

            // 更新路径信息
            updatePathInfo(files[0]);
            
            // 启用导入按钮
            document.getElementById('importBtn').disabled = false;
        }

        function displayFileInfo(files) {
            const fileList = document.getElementById('fileList');
            const fileInfo = document.getElementById('fileInfo');
            
            fileList.innerHTML = '';
            
            files.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'lol-file-item';
                fileItem.innerHTML = `
                    <div class="lol-file-icon">
                        <i data-lucide="video" class="w-5 h-5"></i>
                    </div>
                    <div class="lol-file-details">
                        <div class="lol-file-name">${file.name}</div>
                        <div class="lol-file-size">${formatFileSize(file.size)}</div>
                    </div>
                `;
                fileList.appendChild(fileItem);
            });
            
            fileInfo.classList.remove('lol-hidden');
            lucide.createIcons();
        }

        function showFormSection() {
            document.getElementById('formSection').classList.remove('lol-hidden');
        }

        function updatePathInfo(file) {
            const originalPath = `C:\\Users\\${getUserName()}\\Documents\\League of Legends\\Replays\\${file.name}`;
            const targetPath = `D:\\Sources\\loler\\data\\${file.name}`;
            
            document.getElementById('originalPath').textContent = originalPath;
            document.getElementById('targetPath').textContent = targetPath;
        }

        function getUserName() {
            // 模拟获取用户名
            return 'cruld';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function importReplay() {
            if (selectedFiles.length === 0) {
                showError('请先选择录像文件');
                return;
            }

            const matchName = document.getElementById('matchName').value.trim();
            if (!matchName) {
                showError('请输入对局名称');
                return;
            }

            // 显示进度条
            showProgress();
            
            // 模拟导入过程
            simulateImport();
        }

        function showProgress() {
            const progressContainer = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            
            progressContainer.classList.remove('lol-hidden');
            progressBar.style.width = '0%';
        }

        function simulateImport() {
            const progressBar = document.getElementById('progressBar');
            const importBtn = document.getElementById('importBtn');
            
            importBtn.disabled = true;
            importBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 导入中...';
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        completeImport();
                    }, 500);
                }
            }, 200);
        }

        function completeImport() {
            const matchName = document.getElementById('matchName').value.trim();
            const description = document.getElementById('description').value.trim();
            const originalPath = document.getElementById('originalPath').textContent;
            const targetPath = document.getElementById('targetPath').textContent;

            // 创建导入数据
            const importData = {
                "对局名称": matchName,
                "导入后的文件路径": targetPath,
                "导入前的文件路径": originalPath,
                "description": description
            };

            console.log('导入数据:', importData);

            // 显示成功消息
            showSuccess('录像导入成功！');
            
            // 重置表单
            setTimeout(() => {
                resetForm();
            }, 2000);
        }

        function resetForm() {
            selectedFiles = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('matchName').value = '';
            document.getElementById('description').value = '';
            document.getElementById('fileInfo').classList.add('lol-hidden');
            document.getElementById('formSection').classList.add('lol-hidden');
            document.getElementById('uploadProgress').classList.add('lol-hidden');
            document.getElementById('importBtn').disabled = true;
            document.getElementById('importBtn').innerHTML = '<i data-lucide="download" class="w-4 h-4"></i> 导入录像';
            
            hideMessages();
            lucide.createIcons();
        }

        function showSuccess(message) {
            const successMsg = document.getElementById('successMessage');
            successMsg.querySelector('span').textContent = message;
            successMsg.classList.remove('lol-hidden');
            
            setTimeout(() => {
                successMsg.classList.add('lol-hidden');
            }, 3000);
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorMsg.classList.remove('lol-hidden');
            
            setTimeout(() => {
                errorMsg.classList.add('lol-hidden');
            }, 3000);
        }

        function hideMessages() {
            document.getElementById('successMessage').classList.add('lol-hidden');
            document.getElementById('errorMessage').classList.add('lol-hidden');
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'o') {
                event.preventDefault();
                document.getElementById('fileInput').click();
            }
            
            if (event.key === 'Escape') {
                resetForm();
            }
        });
    </script>
</body>
</html>
