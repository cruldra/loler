<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOL助手 - 英雄联盟辅助工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/lol_theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans) !important;
            background: var(--background) !important;
            color: var(--foreground) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--card) !important;
            border-bottom: 1px solid var(--border) !important;
            box-shadow: var(--shadow-lg) !important;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            color: var(--primary) !important;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) !important;
        }

        .logo:hover {
            transform: scale(1.05) rotate(5deg) !important;
            color: var(--accent) !important;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-item {
            position: relative;
            padding: 0.75rem 1rem !important;
            color: var(--muted-foreground) !important;
            text-decoration: none !important;
            font-weight: 500 !important;
            font-size: 0.95rem !important;
            border-radius: var(--radius) !important;
            transition: all 0.2s ease-out !important;
            cursor: pointer;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: all 0.3s ease-out;
            transform: translateX(-50%);
        }

        .nav-item:hover {
            color: var(--foreground) !important;
            transform: translateY(-2px) !important;
            background: rgba(255, 215, 0, 0.1) !important;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3) !important;
        }

        .nav-item:hover::after {
            width: 100%;
        }

        .nav-item.active {
            color: var(--primary) !important;
            background: rgba(255, 215, 0, 0.15) !important;
        }

        .nav-item.active::after {
            width: 100%;
        }

        .user-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .action-btn {
            width: 2.5rem !important;
            height: 2.5rem !important;
            border-radius: var(--radius) !important;
            background: var(--muted) !important;
            border: 1px solid var(--border) !important;
            color: var(--muted-foreground) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            transition: all 0.2s ease-out !important;
        }

        .action-btn:hover {
            background: var(--primary) !important;
            color: var(--primary-foreground) !important;
            transform: scale(1.02) !important;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4) !important;
        }

        .action-btn:active {
            transform: scale(0.98) !important;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, 
                var(--background) 0%, 
                rgba(255, 215, 0, 0.05) 50%, 
                var(--background) 100%);
        }

        .placeholder-content {
            text-align: center;
            max-width: 600px;
        }

        .placeholder-title {
            font-size: 2.5rem !important;
            font-weight: 700 !important;
            color: var(--primary) !important;
            margin-bottom: 1rem !important;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .placeholder-subtitle {
            font-size: 1.2rem !important;
            color: var(--muted-foreground) !important;
            margin-bottom: 2rem !important;
            line-height: 1.6 !important;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .feature-card {
            background: var(--card) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius-lg) !important;
            padding: 1.5rem !important;
            text-align: center;
            transition: all 0.3s ease-out !important;
            cursor: pointer;
        }

        .feature-card:hover {
            transform: translateY(-4px) !important;
            box-shadow: var(--shadow-xl) !important;
            border-color: var(--primary) !important;
            background: rgba(255, 215, 0, 0.05) !important;
        }

        .feature-icon {
            width: 3rem !important;
            height: 3rem !important;
            margin: 0 auto 1rem !important;
            background: var(--primary) !important;
            border-radius: var(--radius) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: var(--primary-foreground) !important;
        }

        .feature-title {
            font-size: 1.1rem !important;
            font-weight: 600 !important;
            color: var(--foreground) !important;
            margin-bottom: 0.5rem !important;
        }

        .feature-desc {
            font-size: 0.9rem !important;
            color: var(--muted-foreground) !important;
            line-height: 1.4 !important;
        }

        .footer {
            background: var(--card) !important;
            border-top: 1px solid var(--border) !important;
            padding: 2rem 0 !important;
            text-align: center;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .footer-main {
            color: var(--muted-foreground) !important;
            font-size: 0.9rem !important;
            margin-bottom: 1rem !important;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .footer-link {
            color: var(--muted-foreground) !important;
            text-decoration: none !important;
            font-size: 0.85rem !important;
            transition: color 0.2s ease-out !important;
        }

        .footer-link:hover {
            color: var(--primary) !important;
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }

        .animate-pulse {
            animation: pulse 1.2s infinite;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-menu {
                gap: 1rem;
            }
            
            .nav-item {
                padding: 0.5rem 0.75rem !important;
                font-size: 0.9rem !important;
            }
            
            .placeholder-title {
                font-size: 2rem !important;
            }
            
            .footer-links {
                gap: 1rem;
            }
        }

        @media (max-width: 640px) {
            .nav-menu {
                display: none;
            }
            
            .user-actions {
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="logo">
                    <i data-lucide="gamepad-2" class="w-6 h-6"></i>
                    LOL助手
                </div>

                <!-- Navigation Menu -->
                <nav class="nav-menu">
                    <a href="#" class="nav-item active">英雄查询</a>
                    <a href="#" class="nav-item">装备查询</a>
                    <a href="#" class="nav-item">符文搭配</a>
                    <a href="#" class="nav-item">出装思路</a>
                    <a href="#" class="nav-item">阵容B/P</a>
                    <a href="#" class="nav-item">对线细节</a>
                    <a href="#" class="nav-item">野区规划</a>
                </nav>

                <!-- User Actions -->
                <div class="user-actions">
                    <button class="action-btn" title="搜索">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                    <button class="action-btn" title="设置">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                    <button class="action-btn" title="用户">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content animate-fade-in-up">
        <div class="placeholder-content">
            <h1 class="placeholder-title">欢迎使用 LOL助手</h1>
            <p class="placeholder-subtitle">
                专业的英雄联盟辅助工具，提供英雄数据、装备分析、符文搭配等全方位游戏支持
            </p>
            
            <div class="feature-grid">
                <div class="feature-card">
                    <div class="feature-icon">
                        <i data-lucide="sword" class="w-6 h-6"></i>
                    </div>
                    <h3 class="feature-title">英雄查询</h3>
                    <p class="feature-desc">详细的英雄技能、属性和玩法攻略</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i data-lucide="shield" class="w-6 h-6"></i>
                    </div>
                    <h3 class="feature-title">装备分析</h3>
                    <p class="feature-desc">最优装备搭配和出装顺序推荐</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i data-lucide="zap" class="w-6 h-6"></i>
                    </div>
                    <h3 class="feature-title">符文配置</h3>
                    <p class="feature-desc">专业符文搭配方案和天赋选择</p>
                </div>
                
                <div class="feature-card">
                    <div class="feature-icon">
                        <i data-lucide="users" class="w-6 h-6"></i>
                    </div>
                    <h3 class="feature-title">阵容分析</h3>
                    <p class="feature-desc">Ban/Pick策略和团队配合建议</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-main">
                © 2024 LOL助手 | 数据来源: Riot Games
            </div>
            <div class="footer-links">
                <a href="#" class="footer-link">联系我们</a>
                <a href="#" class="footer-link">意见反馈</a>
                <a href="#" class="footer-link">更新日志</a>
                <a href="#" class="footer-link">隐私政策</a>
                <a href="#" class="footer-link">服务条款</a>
            </div>
        </div>
    </footer>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        // 导航菜单交互
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                
                // 移除所有活跃状态
                document.querySelectorAll('.nav-item').forEach(nav => {
                    nav.classList.remove('active');
                });
                
                // 添加活跃状态到当前项
                this.classList.add('active');
                
                // 添加点击动画效果
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });

        // 按钮点击效果
        document.querySelectorAll('.action-btn, .feature-card').forEach(btn => {
            btn.addEventListener('click', function() {
                // 创建涟漪效果
                const ripple = document.createElement('div');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 215, 0, 0.6)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.4s linear';
                ripple.style.left = '50%';
                ripple.style.top = '50%';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                ripple.style.marginLeft = '-10px';
                ripple.style.marginTop = '-10px';
                
                this.style.position = 'relative';
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 400);
            });
        });

        // 添加涟漪动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 页面加载动画
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.8s ease-out';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });

        // 滚动效果
        let lastScrollTop = 0;
        window.addEventListener('scroll', function() {
            const header = document.querySelector('.header');
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                // 向下滚动
                header.style.transform = 'translateY(-100%)';
            } else {
                // 向上滚动
                header.style.transform = 'translateY(0)';
            }
            
            lastScrollTop = scrollTop;
        });
    </script>
</body>
</html>
