<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>录像导入 - LOL助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lol_theme.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans) !important;
            background: 
                radial-gradient(ellipse at center, rgba(20, 30, 48, 0.8) 0%, rgba(10, 15, 25, 0.95) 70%),
                linear-gradient(135deg, #0f1419 0%, #1a2332 50%, #0f1419 100%) !important;
            color: #c9aa71 !important;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景纹理效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(200, 170, 110, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(200, 170, 110, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .lol-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        .lol-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .lol-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #c9aa71;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(201, 170, 113, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .lol-subtitle {
            font-size: 1.1rem;
            color: rgba(201, 170, 113, 0.7);
            font-weight: 400;
        }

        .lol-main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .lol-import-card {
            background: linear-gradient(135deg, 
                rgba(20, 30, 48, 0.9) 0%, 
                rgba(15, 25, 40, 0.95) 50%, 
                rgba(10, 20, 35, 0.9) 100%);
            border: 2px solid rgba(201, 170, 113, 0.2);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(201, 170, 113, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            height: fit-content;
        }

        .lol-import-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #c9aa71 50%, 
                transparent 100%);
            opacity: 0.6;
        }

        .lol-section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #c9aa71;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .lol-folder-selector {
            background: rgba(201, 170, 113, 0.05);
            border: 1px solid rgba(201, 170, 113, 0.2);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            transition: all 300ms ease;
        }

        .lol-folder-selector:hover {
            border-color: rgba(201, 170, 113, 0.4);
            background: rgba(201, 170, 113, 0.08);
        }

        .lol-folder-display {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .lol-folder-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #c9aa71, #d4b876);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f1419;
            font-size: 1.5rem;
        }

        .lol-folder-info {
            flex: 1;
        }

        .lol-folder-name {
            font-weight: 600;
            color: #c9aa71;
            margin-bottom: 0.25rem;
        }

        .lol-folder-path {
            font-size: 0.85rem;
            color: rgba(201, 170, 113, 0.6);
            font-family: var(--font-mono);
            word-break: break-all;
        }

        .lol-folder-actions {
            display: flex;
            gap: 1rem;
        }

        .lol-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 300ms ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .lol-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.1) 50%, 
                transparent 100%);
            transition: left 500ms ease;
        }

        .lol-btn:hover::before {
            left: 100%;
        }

        .lol-btn-secondary {
            background: rgba(201, 170, 113, 0.1);
            color: rgba(201, 170, 113, 0.8);
            border: 1px solid rgba(201, 170, 113, 0.2);
        }

        .lol-btn-secondary:hover {
            background: rgba(201, 170, 113, 0.15);
            color: #c9aa71;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(201, 170, 113, 0.1);
        }

        .lol-btn-primary {
            background: linear-gradient(135deg, #c9aa71, #d4b876);
            color: #0f1419;
            box-shadow: 0 5px 15px rgba(201, 170, 113, 0.2);
        }

        .lol-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(201, 170, 113, 0.3);
        }

        .lol-btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .lol-file-grid {
            display: grid;
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .lol-file-card {
            background: rgba(201, 170, 113, 0.05);
            border: 1px solid rgba(201, 170, 113, 0.2);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 300ms ease;
            cursor: pointer;
            position: relative;
        }

        .lol-file-card:hover {
            border-color: rgba(201, 170, 113, 0.4);
            background: rgba(201, 170, 113, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .lol-file-card.selected {
            border-color: #c9aa71;
            background: rgba(201, 170, 113, 0.1);
            box-shadow: 0 0 0 2px rgba(201, 170, 113, 0.3);
        }

        .lol-file-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .lol-file-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #c9aa71, #d4b876);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f1419;
            font-size: 1.2rem;
        }

        .lol-file-info {
            flex: 1;
        }

        .lol-file-name {
            font-weight: 600;
            color: #c9aa71;
            margin-bottom: 0.25rem;
            font-size: 0.95rem;
        }

        .lol-file-meta {
            font-size: 0.8rem;
            color: rgba(201, 170, 113, 0.6);
            display: flex;
            gap: 1rem;
        }

        .lol-file-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(201, 170, 113, 0.3);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: all 250ms ease;
        }

        .lol-file-checkbox.checked {
            background: linear-gradient(135deg, #c9aa71, #d4b876);
            border-color: #c9aa71;
        }

        .lol-file-checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: -2px;
            left: 2px;
            color: #0f1419;
            font-size: 14px;
            font-weight: bold;
        }

        .lol-file-form {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(201, 170, 113, 0.1);
        }

        .lol-form-group {
            margin-bottom: 1rem;
        }

        .lol-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(201, 170, 113, 0.8);
            margin-bottom: 0.5rem;
        }

        .lol-input {
            width: 100%;
            background: rgba(201, 170, 113, 0.05);
            border: 1px solid rgba(201, 170, 113, 0.2);
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            color: #c9aa71;
            font-size: 0.9rem;
            transition: all 300ms ease;
        }

        .lol-input:focus {
            outline: none;
            border-color: #c9aa71;
            background: rgba(201, 170, 113, 0.08);
            box-shadow: 0 0 0 2px rgba(201, 170, 113, 0.1);
        }

        .lol-textarea {
            min-height: 60px;
            resize: vertical;
        }

        .lol-import-summary {
            background: rgba(201, 170, 113, 0.05);
            border: 1px solid rgba(201, 170, 113, 0.2);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .lol-summary-title {
            font-weight: 600;
            color: #c9aa71;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lol-summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .lol-stat-item {
            text-align: center;
        }

        .lol-stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #c9aa71;
        }

        .lol-stat-label {
            font-size: 0.8rem;
            color: rgba(201, 170, 113, 0.6);
        }

        .lol-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .lol-hidden {
            display: none;
        }

        .lol-success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lol-error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #f44336;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lol-import-card {
            animation: fadeInUp 600ms ease-out;
        }

        .lol-file-card {
            animation: fadeInUp 400ms ease-out;
        }

        .lol-file-card:nth-child(1) { animation-delay: 0ms; }
        .lol-file-card:nth-child(2) { animation-delay: 100ms; }
        .lol-file-card:nth-child(3) { animation-delay: 200ms; }
        .lol-file-card:nth-child(4) { animation-delay: 300ms; }
        .lol-file-card:nth-child(5) { animation-delay: 400ms; }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .lol-main-layout {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .lol-container {
                padding: 1rem;
            }

            .lol-title {
                font-size: 2rem;
            }

            .lol-folder-actions {
                flex-direction: column;
            }

            .lol-actions {
                flex-direction: column;
            }

            .lol-btn {
                justify-content: center;
            }

            .lol-summary-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="lol-container">
        <div class="lol-header">
            <h1 class="lol-title">
                <i data-lucide="video" class="w-10 h-10"></i>
                录像导入
            </h1>
            <p class="lol-subtitle">从LOL录像文件夹批量导入并管理录像文件</p>
        </div>

        <div class="lol-main-layout">
            <!-- 左侧：文件夹选择和操作 -->
            <div class="lol-import-card">
                <!-- 成功/错误消息 -->
                <div id="successMessage" class="lol-success-message lol-hidden">
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                    <span>操作成功！</span>
                </div>

                <div id="errorMessage" class="lol-error-message lol-hidden">
                    <i data-lucide="alert-circle" class="w-5 h-5"></i>
                    <span id="errorText">操作失败，请重试</span>
                </div>

                <div class="lol-section-title">
                    <i data-lucide="folder" class="w-5 h-5"></i>
                    录像文件夹
                </div>

                <div class="lol-folder-selector">
                    <div class="lol-folder-display">
                        <div class="lol-folder-icon">
                            <i data-lucide="folder" class="w-6 h-6"></i>
                        </div>
                        <div class="lol-folder-info">
                            <div class="lol-folder-name">League of Legends 录像文件夹</div>
                            <div class="lol-folder-path" id="folderPath">C:\Users\cruld\Documents\League of Legends\Replays</div>
                        </div>
                    </div>
                    
                    <div class="lol-folder-actions">
                        <button class="lol-btn lol-btn-secondary" onclick="selectFolder()">
                            <i data-lucide="folder-open" class="w-4 h-4"></i>
                            更改文件夹
                        </button>
                        <button class="lol-btn lol-btn-primary" onclick="scanFolder()">
                            <i data-lucide="search" class="w-4 h-4"></i>
                            扫描录像
                        </button>
                    </div>
                </div>

                <!-- 导入摘要 -->
                <div id="importSummary" class="lol-import-summary lol-hidden">
                    <div class="lol-summary-title">
                        <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                        导入摘要
                    </div>
                    <div class="lol-summary-stats">
                        <div class="lol-stat-item">
                            <div class="lol-stat-number" id="totalFiles">0</div>
                            <div class="lol-stat-label">总文件数</div>
                        </div>
                        <div class="lol-stat-item">
                            <div class="lol-stat-number" id="selectedFiles">0</div>
                            <div class="lol-stat-label">已选择</div>
                        </div>
                        <div class="lol-stat-item">
                            <div class="lol-stat-number" id="completedFiles">0</div>
                            <div class="lol-stat-label">已完成</div>
                        </div>
                        <div class="lol-stat-item">
                            <div class="lol-stat-number" id="totalSize">0MB</div>
                            <div class="lol-stat-label">总大小</div>
                        </div>
                    </div>
                </div>

                <div class="lol-actions">
                    <button id="selectAllBtn" class="lol-btn lol-btn-secondary lol-hidden" onclick="selectAllFiles()">
                        <i data-lucide="check-square" class="w-4 h-4"></i>
                        全选
                    </button>
                    <button id="clearAllBtn" class="lol-btn lol-btn-secondary lol-hidden" onclick="clearAllFiles()">
                        <i data-lucide="square" class="w-4 h-4"></i>
                        清空
                    </button>
                    <button id="importBtn" class="lol-btn lol-btn-primary lol-hidden" onclick="importSelectedFiles()" disabled>
                        <i data-lucide="download" class="w-4 h-4"></i>
                        导入录像
                    </button>
                </div>
            </div>

            <!-- 右侧：录像文件列表 -->
            <div class="lol-import-card">
                <div class="lol-section-title">
                    <i data-lucide="video" class="w-5 h-5"></i>
                    录像文件
                    <span id="fileCount" style="font-size: 0.9rem; color: rgba(201, 170, 113, 0.6);">(0个文件)</span>
                </div>

                <div id="fileGrid" class="lol-file-grid">
                    <div style="text-align: center; padding: 3rem; color: rgba(201, 170, 113, 0.5);">
                        <i data-lucide="folder-search" class="w-12 h-12 mx-auto mb-2"></i>
                        <p>点击"扫描录像"开始导入</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();

        let replayFiles = [];
        let selectedFiles = new Set();

        // 模拟录像文件数据
        const mockReplayFiles = [
            {
                name: "LOL_Replay_2024_01_15_14_30_25.rofl",
                size: 45234567,
                date: "2024-01-15 14:30:25",
                title: "",
                description: ""
            },
            {
                name: "LOL_Replay_2024_01_14_20_15_42.rofl",
                size: 38765432,
                date: "2024-01-14 20:15:42",
                title: "",
                description: ""
            },
            {
                name: "LOL_Replay_2024_01_13_16_45_18.rofl",
                size: 52134567,
                date: "2024-01-13 16:45:18",
                title: "",
                description: ""
            },
            {
                name: "LOL_Replay_2024_01_12_19_22_33.rofl",
                size: 41876543,
                date: "2024-01-12 19:22:33",
                title: "",
                description: ""
            },
            {
                name: "LOL_Replay_2024_01_11_21_08_15.rofl",
                size: 47654321,
                date: "2024-01-11 21:08:15",
                title: "",
                description: ""
            }
        ];

        function selectFolder() {
            const newPath = prompt("请输入录像文件夹路径:", document.getElementById('folderPath').textContent);
            if (newPath) {
                document.getElementById('folderPath').textContent = newPath;
            }
        }

        function scanFolder() {
            showSuccess("正在扫描录像文件...");
            
            setTimeout(() => {
                replayFiles = mockReplayFiles.map(file => ({
                    ...file,
                    title: generateDefaultTitle(file.name),
                    description: ""
                }));
                
                displayFileGrid();
                updateSummary();
                showControls();
                hideMessages();
            }, 1500);
        }

        function displayFileGrid() {
            const fileGrid = document.getElementById('fileGrid');
            const fileCount = document.getElementById('fileCount');
            
            fileCount.textContent = `(${replayFiles.length}个文件)`;
            fileGrid.innerHTML = '';

            replayFiles.forEach((file, index) => {
                const fileCard = document.createElement('div');
                fileCard.className = 'lol-file-card';
                fileCard.onclick = () => toggleFileSelection(index);
                
                fileCard.innerHTML = `
                    <div class="lol-file-header">
                        <div class="lol-file-icon">
                            <i data-lucide="video" class="w-5 h-5"></i>
                        </div>
                        <div class="lol-file-info">
                            <div class="lol-file-name">${file.name}</div>
                            <div class="lol-file-meta">
                                <span>${formatFileSize(file.size)}</span>
                                <span>${file.date}</span>
                            </div>
                        </div>
                        <div class="lol-file-checkbox" id="checkbox-${index}"></div>
                    </div>
                    
                    <div class="lol-file-form">
                        <div class="lol-form-group">
                            <label class="lol-label">对局名称</label>
                            <input type="text" class="lol-input" value="${file.title}" 
                                   onchange="updateFileTitle(${index}, this.value)"
                                   onclick="event.stopPropagation()">
                        </div>
                        <div class="lol-form-group">
                            <label class="lol-label">描述信息</label>
                            <textarea class="lol-input lol-textarea" 
                                      placeholder="添加对局描述、学习要点等..."
                                      onchange="updateFileDescription(${index}, this.value)"
                                      onclick="event.stopPropagation()">${file.description}</textarea>
                        </div>
                    </div>
                `;
                
                fileGrid.appendChild(fileCard);
            });
            
            lucide.createIcons();
        }

        function toggleFileSelection(index) {
            const checkbox = document.getElementById(`checkbox-${index}`);
            const fileCard = checkbox.closest('.lol-file-card');
            
            if (selectedFiles.has(index)) {
                selectedFiles.delete(index);
                checkbox.classList.remove('checked');
                fileCard.classList.remove('selected');
            } else {
                selectedFiles.add(index);
                checkbox.classList.add('checked');
                fileCard.classList.add('selected');
            }
            
            updateSummary();
            updateImportButton();
        }

        function selectAllFiles() {
            replayFiles.forEach((_, index) => {
                selectedFiles.add(index);
                const checkbox = document.getElementById(`checkbox-${index}`);
                const fileCard = checkbox.closest('.lol-file-card');
                checkbox.classList.add('checked');
                fileCard.classList.add('selected');
            });
            updateSummary();
            updateImportButton();
        }

        function clearAllFiles() {
            selectedFiles.clear();
            replayFiles.forEach((_, index) => {
                const checkbox = document.getElementById(`checkbox-${index}`);
                const fileCard = checkbox.closest('.lol-file-card');
                checkbox.classList.remove('checked');
                fileCard.classList.remove('selected');
            });
            updateSummary();
            updateImportButton();
        }

        function updateFileTitle(index, title) {
            replayFiles[index].title = title;
            updateCompletedCount();
        }

        function updateFileDescription(index, description) {
            replayFiles[index].description = description;
            updateCompletedCount();
        }

        function updateCompletedCount() {
            const completed = Array.from(selectedFiles).filter(index => 
                replayFiles[index].title.trim() !== ''
            ).length;
            document.getElementById('completedFiles').textContent = completed;
        }

        function updateSummary() {
            document.getElementById('totalFiles').textContent = replayFiles.length;
            document.getElementById('selectedFiles').textContent = selectedFiles.size;
            
            const totalSize = Array.from(selectedFiles).reduce((sum, index) => 
                sum + replayFiles[index].size, 0
            );
            document.getElementById('totalSize').textContent = formatFileSize(totalSize);
            
            updateCompletedCount();
        }

        function updateImportButton() {
            const importBtn = document.getElementById('importBtn');
            importBtn.disabled = selectedFiles.size === 0;
        }

        function showControls() {
            document.getElementById('importSummary').classList.remove('lol-hidden');
            document.getElementById('selectAllBtn').classList.remove('lol-hidden');
            document.getElementById('clearAllBtn').classList.remove('lol-hidden');
            document.getElementById('importBtn').classList.remove('lol-hidden');
        }

        function importSelectedFiles() {
            const unnamedFiles = Array.from(selectedFiles).filter(index => 
                !replayFiles[index].title.trim()
            );
            
            if (unnamedFiles.length > 0) {
                showError(`还有 ${unnamedFiles.length} 个录像未添加标题，请完善信息后再导入`);
                return;
            }
            
            const importBtn = document.getElementById('importBtn');
            importBtn.disabled = true;
            importBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> 导入中...';
            
            setTimeout(() => {
                const importData = Array.from(selectedFiles).map(index => {
                    const file = replayFiles[index];
                    const folderPath = document.getElementById('folderPath').textContent;
                    return {
                        "对局名称": file.title,
                        "导入后的文件路径": `D:\\Sources\\loler\\data\\${file.name}`,
                        "导入前的文件路径": `${folderPath}\\${file.name}`,
                        "description": file.description
                    };
                });
                
                console.log('导入数据:', importData);
                showSuccess(`成功导入 ${selectedFiles.size} 个录像文件！`);
                
                // 重置状态
                setTimeout(() => {
                    selectedFiles.clear();
                    displayFileGrid();
                    updateSummary();
                    
                    importBtn.disabled = false;
                    importBtn.innerHTML = '<i data-lucide="download" class="w-4 h-4"></i> 导入录像';
                    lucide.createIcons();
                }, 2000);
            }, 3000);
        }

        function generateDefaultTitle(filename) {
            const match = filename.match(/LOL_Replay_(\d{4})_(\d{2})_(\d{2})_(\d{2})_(\d{2})_(\d{2})/);
            if (match) {
                const [, year, month, day, hour, minute] = match;
                return `${year}-${month}-${day} ${hour}:${minute} 对局录像`;
            }
            return filename.replace('.rofl', '');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showSuccess(message) {
            const successMsg = document.getElementById('successMessage');
            successMsg.querySelector('span').textContent = message;
            successMsg.classList.remove('lol-hidden');
            
            setTimeout(() => {
                successMsg.classList.add('lol-hidden');
            }, 3000);
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            document.getElementById('errorText').textContent = message;
            errorMsg.classList.remove('lol-hidden');
            
            setTimeout(() => {
                errorMsg.classList.add('lol-hidden');
            }, 3000);
        }

        function hideMessages() {
            document.getElementById('successMessage').classList.add('lol-hidden');
            document.getElementById('errorMessage').classList.add('lol-hidden');
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'a') {
                event.preventDefault();
                selectAllFiles();
            }
            
            if (event.key === 'Escape') {
                clearAllFiles();
            }
        });
    </script>
</body>
</html>
