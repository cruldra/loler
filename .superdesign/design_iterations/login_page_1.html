<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - LOL助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lol_theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans) !important;
            background: linear-gradient(135deg, 
                #0a0e1a 0%, 
                #1a1f2e 25%, 
                #2a2f3e 50%, 
                #1a1f2e 75%, 
                #0a0e1a 100%) !important;
            color: var(--foreground) !important;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 背景动画效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(96, 165, 250, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -2;
            animation: backgroundShift 20s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-10px) translateY(-10px); }
            50% { transform: translateX(10px) translateY(10px); }
            75% { transform: translateX(-5px) translateY(15px); }
        }

        /* 浮动粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        .login-card {
            background: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2) !important;
            border-radius: var(--radius-xl) !important;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.5),
                0 0 50px rgba(255, 215, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.05) 0%, 
                transparent 50%, 
                rgba(96, 165, 250, 0.05) 100%);
            pointer-events: none;
        }

        .login-content {
            position: relative;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: var(--radius-lg) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-foreground) !important;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .logo-text {
            font-size: 1.5rem !important;
            font-weight: 700 !important;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-title {
            font-size: 1.8rem !important;
            font-weight: 600 !important;
            color: var(--foreground) !important;
            margin-bottom: 0.5rem !important;
        }

        .login-subtitle {
            color: var(--muted-foreground) !important;
            font-size: 0.95rem !important;
        }

        .login-form {
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem !important;
            font-weight: 500 !important;
            color: var(--foreground) !important;
            margin-bottom: 0.5rem !important;
        }

        .form-input {
            width: 100% !important;
            padding: 0.875rem 1rem !important;
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius) !important;
            color: var(--foreground) !important;
            font-size: 0.95rem !important;
            transition: all 0.2s ease-out !important;
            backdrop-filter: blur(10px);
        }

        .form-input:focus {
            outline: none !important;
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1) !important;
            background: rgba(0, 0, 0, 0.4) !important;
        }

        .form-input::placeholder {
            color: var(--muted-foreground) !important;
        }

        .password-input-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none !important;
            border: none !important;
            color: var(--muted-foreground) !important;
            cursor: pointer !important;
            padding: 0.25rem !important;
            border-radius: var(--radius) !important;
            transition: color 0.2s ease-out !important;
        }

        .password-toggle:hover {
            color: var(--foreground) !important;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem !important;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--muted-foreground) !important;
        }

        .checkbox {
            width: 1rem !important;
            height: 1rem !important;
            accent-color: var(--primary) !important;
        }

        .forgot-password {
            color: var(--primary) !important;
            text-decoration: none !important;
            transition: color 0.2s ease-out !important;
        }

        .forgot-password:hover {
            color: var(--accent) !important;
        }

        .login-button {
            width: 100% !important;
            padding: 0.875rem 1.5rem !important;
            background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
            color: var(--primary-foreground) !important;
            border: none !important;
            border-radius: var(--radius) !important;
            font-size: 0.95rem !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.2s ease-out !important;
            position: relative;
            overflow: hidden;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3) !important;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--muted-foreground) !important;
            font-size: 0.85rem !important;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border) !important;
        }

        .divider span {
            padding: 0 1rem;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .social-button {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 0.75rem !important;
            width: 100% !important;
            padding: 0.875rem 1.5rem !important;
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--border) !important;
            border-radius: var(--radius) !important;
            color: var(--foreground) !important;
            font-size: 0.95rem !important;
            font-weight: 500 !important;
            cursor: pointer !important;
            transition: all 0.2s ease-out !important;
            text-decoration: none !important;
            backdrop-filter: blur(10px);
        }

        .social-button:hover {
            background: rgba(0, 0, 0, 0.5) !important;
            border-color: var(--primary) !important;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2) !important;
        }

        .social-button:active {
            transform: translateY(0);
        }

        .github-button {
            border-color: #333 !important;
        }

        .github-button:hover {
            border-color: #24292e !important;
            background: rgba(36, 41, 46, 0.1) !important;
        }

        .google-button {
            border-color: #4285f4 !important;
        }

        .google-button:hover {
            border-color: #4285f4 !important;
            background: rgba(66, 133, 244, 0.1) !important;
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        .signup-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border) !important;
            color: var(--muted-foreground) !important;
            font-size: 0.9rem !important;
        }

        .signup-link a {
            color: var(--primary) !important;
            text-decoration: none !important;
            font-weight: 500 !important;
            transition: color 0.2s ease-out !important;
        }

        .signup-link a:hover {
            color: var(--accent) !important;
        }

        /* 加载状态 */
        .loading {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .login-container {
                padding: 1rem;
            }
            
            .login-card {
                padding: 2rem 1.5rem;
            }
            
            .login-title {
                font-size: 1.5rem !important;
            }
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            animation: fadeInUp 0.6s ease-out;
        }

        /* 错误状态 */
        .form-input.error {
            border-color: var(--destructive) !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1) !important;
        }

        .error-message {
            color: var(--destructive) !important;
            font-size: 0.8rem !important;
            margin-top: 0.5rem !important;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }
    </style>
</head>
<body>
    <!-- 浮动粒子 -->
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-content">
                <!-- 头部 -->
                <div class="login-header">
                    <div class="logo">
                        <div class="logo-icon">
                            <i data-lucide="gamepad-2" class="w-6 h-6"></i>
                        </div>
                        <div class="logo-text">LOL助手</div>
                    </div>
                    <h1 class="login-title">欢迎回来</h1>
                    <p class="login-subtitle">登录您的账户以继续使用</p>
                </div>

                <!-- 登录表单 -->
                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">邮箱地址</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="请输入您的邮箱地址"
                            required
                        >
                        <div class="error-message" id="emailError" style="display: none;">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            <span>请输入有效的邮箱地址</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">密码</label>
                        <div class="password-input-container">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="请输入您的密码"
                                required
                            >
                            <button type="button" class="password-toggle" id="passwordToggle">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="error-message" id="passwordError" style="display: none;">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            <span>密码长度至少6位</span>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" class="checkbox" id="rememberMe">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="forgot-password">忘记密码？</a>
                    </div>

                    <button type="submit" class="login-button" id="loginButton">
                        <span class="button-text">登录</span>
                    </button>
                </form>

                <!-- 分割线 -->
                <div class="divider">
                    <span>或者使用以下方式登录</span>
                </div>

                <!-- 第三方登录 -->
                <div class="social-login">
                    <button class="social-button github-button" id="githubLogin">
                        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0C5.374 0 0 5.373 0 12 0 17.302 3.438 21.8 8.207 23.387c.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                        </svg>
                        <span>使用 GitHub 登录</span>
                    </button>

                    <button class="social-button google-button" id="googleLogin">
                        <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        <span>使用 Google 登录</span>
                    </button>
                </div>

                <!-- 注册链接 -->
                <div class="signup-link">
                    还没有账户？ <a href="#" id="signupLink">立即注册</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化
        function init() {
            lucide.createIcons();
            createParticles();
            setupFormValidation();
            setupPasswordToggle();
            setupSocialLogin();
        }

        // 创建浮动粒子
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // 设置表单验证
        function setupFormValidation() {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginButton = document.getElementById('loginButton');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                // 重置错误状态
                clearErrors();
                
                // 验证邮箱
                if (!isValidEmail(email)) {
                    showError('email', '请输入有效的邮箱地址');
                    return;
                }
                
                // 验证密码
                if (password.length < 6) {
                    showError('password', '密码长度至少6位');
                    return;
                }
                
                // 显示加载状态
                setLoading(true);
                
                try {
                    // 模拟登录请求
                    await simulateLogin(email, password);
                    showSuccess('登录成功！');
                    
                    // 延迟跳转
                    setTimeout(() => {
                        window.location.href = 'lol_helper_1.html';
                    }, 1500);
                } catch (error) {
                    showError('general', '登录失败，请检查您的凭据');
                } finally {
                    setLoading(false);
                }
            });
        }

        // 设置密码显示切换
        function setupPasswordToggle() {
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            
            passwordToggle.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                
                const icon = passwordToggle.querySelector('i');
                icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
                lucide.createIcons();
            });
        }

        // 设置第三方登录
        function setupSocialLogin() {
            const githubButton = document.getElementById('githubLogin');
            const googleButton = document.getElementById('googleLogin');
            
            githubButton.addEventListener('click', () => {
                handleSocialLogin('github');
            });
            
            googleButton.addEventListener('click', () => {
                handleSocialLogin('google');
            });
        }

        // 处理第三方登录
        async function handleSocialLogin(provider) {
            const button = document.getElementById(`${provider}Login`);
            const originalText = button.querySelector('span').textContent;
            
            // 显示加载状态
            button.disabled = true;
            button.querySelector('span').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>连接中...</span>
                </div>
            `;
            
            try {
                // 模拟第三方登录
                await simulateSocialLogin(provider);
                showSuccess(`${provider === 'github' ? 'GitHub' : 'Google'} 登录成功！`);
                
                setTimeout(() => {
                    window.location.href = 'lol_helper_1.html';
                }, 1500);
            } catch (error) {
                showError('general', `${provider === 'github' ? 'GitHub' : 'Google'} 登录失败`);
            } finally {
                button.disabled = false;
                button.querySelector('span').textContent = originalText;
            }
        }

        // 模拟登录请求
        function simulateLogin(email, password) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    // 模拟成功登录
                    if (email && password.length >= 6) {
                        resolve({ success: true });
                    } else {
                        reject(new Error('Invalid credentials'));
                    }
                }, 2000);
            });
        }

        // 模拟第三方登录
        function simulateSocialLogin(provider) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    // 模拟成功登录
                    resolve({ success: true, provider });
                }, 1500);
            });
        }

        // 验证邮箱格式
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // 显示错误
        function showError(field, message) {
            if (field === 'general') {
                showNotification(message, 'error');
                return;
            }
            
            const input = document.getElementById(field);
            const errorElement = document.getElementById(`${field}Error`);
            
            input.classList.add('error');
            errorElement.style.display = 'flex';
            errorElement.querySelector('span').textContent = message;
        }

        // 清除错误
        function clearErrors() {
            const inputs = document.querySelectorAll('.form-input');
            const errors = document.querySelectorAll('.error-message');
            
            inputs.forEach(input => input.classList.remove('error'));
            errors.forEach(error => error.style.display = 'none');
        }

        // 设置加载状态
        function setLoading(loading) {
            const button = document.getElementById('loginButton');
            const buttonText = button.querySelector('.button-text');
            
            if (loading) {
                button.disabled = true;
                buttonText.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <span>登录中...</span>
                    </div>
                `;
            } else {
                button.disabled = false;
                buttonText.textContent = '登录';
            }
        }

        // 显示成功消息
        function showSuccess(message) {
            showNotification(message, 'success');
        }

        // 显示通知
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'error' ? 'var(--destructive)' : 'var(--primary)'};
                color: white;
                padding: 1rem 1.5rem;
                border-radius: var(--radius);
                box-shadow: var(--shadow-lg);
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            `;
            
            notification.innerHTML = `
                <i data-lucide="${type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-4 h-4"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(notification);
            lucide.createIcons();
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 添加滑入动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
